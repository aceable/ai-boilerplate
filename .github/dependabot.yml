version: 2

# Dependabot keeps dependencies current without consuming Actions minutes.
# Grouped updates collapse N small PRs into 1 per ecosystem per cycle so the
# review load and CI burn stay predictable on the GitHub Free plan.
#
# Adjust schedule / groups as the project grows. Security alerts always open
# individual PRs regardless of grouping.

updates:
  - package-ecosystem: npm
    # Multiple manifest locations (supports globs too)
    directories:
      - /
    schedule:
      interval: monthly
    versioning-strategy: increase

    # Wait out the npm supply-chain attack window before pulling updates.
    # Security advisories bypass cooldown automatically.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        applies-to: version-updates

    # Optional: reduce noise
    # open-pull-requests-limit: 2

    # Held until upstream support lands. Re-check each on a manual upgrade.
    #   eslint, @eslint/js 10: eslint-config-next bundles eslint-plugin-react/import/jsx-a11y,
    #     whose peers stop at eslint 9 (plugin-react crashes on eslint 10).
    #   typescript 6.1+ and 7: typescript-eslint supports typescript <6.1 only.
    #   typescript-eslint 9: eslint-config-next depends on ^8 and registers the same plugin;
    #     two copies crash flat config.
    #   jsdom 30: requires Node ^24.15.0, above engines.node >=24.0.0.
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "typescript-eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
